[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "table-cleaner"
version = "0.1.0"
description = "A local Streamlit app for cleaning, profiling, and visualizing CSV/Excel tables."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "pandas>=3.0.6,<4",
    "openpyxl>=3.1.5,<4",
    "xlrd>=2.0.2,<3",
    "streamlit>=1.64.0,<2",
    "plotly>=7.1.0,<8",
]

[tool.setuptools.packages.find]
include = ["table_cleaner*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
